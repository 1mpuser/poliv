<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1F2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141712" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Поливалка">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Поливалка — трекер полива растений</title>
  <meta name="description" content="Поливалка — личный трекер ухода за комнатными растениями: полив, подкормки, досветка лампами. Закрытый сервис для своих, учётки выдаёт администратор.">
  <script>try{var t=localStorage.getItem('theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <div id="root">
    <main class="login">
      <div class="login__card">
        <h1>Поливалка</h1>
        <p class="login__about">Личный трекер ухода за комнатными растениями: когда поливать, подкармливать и досвечивать. Закрытый сервис для своих — учётки выдаёт администратор, регистрации нет.</p>
        <noscript><p class="login__about">Для работы нужен JavaScript.</p></noscript>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
