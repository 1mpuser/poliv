<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1F2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141712" media="(prefers-color-scheme: dark)">
  <title>Мои растения</title>
  <script>try{var t=localStorage.getItem('theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Иконки: один спрайт на страницу, <use href="#i-…"> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-water" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
  <symbol id="i-feed" viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12c0-4 3-6.5 7-6.5 0 4-3 6.5-7 6.5z"/><path d="M12 14.5c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></symbol>
  <symbol id="i-lamp" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-repot" viewBox="0 0 24 24"><path d="M5 11h14l-2 9H7z"/><path d="M12 11V6"/><path d="M12 7.5c-2 0-3.5-1.2-3.5-3.5 2 0 3.5 1.2 3.5 3.5zM12 6.5c0-2.2 1.3-3.5 3.5-3.5 0 2.2-1.3 3.5-3.5 3.5z"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z"/><path d="M4 20 14 10"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-plants" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></symbol>
</svg>

<main class="wrap">
  <header class="page-head">
    <img class="logo" src="icon.svg" alt="" width="48" height="48">
    <div class="page-head__grow">
      <h1 class="page-head__title">Мои растения</h1>
      <p class="page-head__sub">Среда, 23 сентября</p>
    </div>
  </header>

  <!-- Сводка: data-status="late" | "ok". Если всё в порядке — «Все растения в порядке». -->
  <p class="todo" data-status="late"><span class="todo__dot"></span>Лайму пора полить. Лимону скоро подкормка.</p>

  <section class="plant-grid" aria-label="Растения">

    <!-- ===== Карточка растения =====
         data-plant-id   — id растения
         .stat[data-stat] — water | feed | lamp
         .stat[data-status] — ok | soon | late
         .action[data-action] — water | feed | lamp -->
    <article class="plant-card" data-plant-id="1">
      <a class="plant-card__head" href="plant.html?id=1">
        <span class="thumb thumb--lemon" aria-hidden="true"><svg><use href="#i-leaf"/></svg></span>
        <span>
          <h2 class="plant-card__name">Лимон «Павловский»</h2>
          <span class="plant-card__place">Кухня, восточное окно</span>
        </span>
        <svg class="i chev" aria-hidden="true"><use href="#i-chev"/></svg>
      </a>

      <div class="stats">
        <div class="stat" data-stat="water" data-status="ok">
          <svg class="i stat__icon" aria-hidden="true"><use href="#i-water"/></svg>
          <span class="stat__value"><span data-value>2</span><small>д</small></span>
          <span class="stat__label">с полива</span>
          <span class="stat__flag" data-flag></span>
        </div>
        <div class="stat" data-stat="feed" data-status="soon">
          <svg class="i stat__icon" aria-hidden="true"><use href="#i-feed"/></svg>
          <span class="stat__value"><span data-value>12</span><small>д</small></span>
          <span class="stat__label">с подкормки</span>
          <span class="stat__flag" data-flag>скоро</span>
        </div>
        <div class="stat" data-stat="lamp" data-status="ok">
          <svg class="i stat__icon" aria-hidden="true"><use href="#i-lamp"/></svg>
          <span class="stat__value"><span data-value>9</span><small>ч</small></span>
          <span class="stat__label">досветка</span>
          <span class="stat__flag" data-flag></span>
        </div>
      </div>

      <div class="actions">
        <button class="action" type="button" data-action="water" data-primary>
          <svg class="i" aria-hidden="true"><use href="#i-water"/></svg>Полить
        </button>
        <button class="action" type="button" data-action="feed">
          <svg class="i" aria-hidden="true"><use href="#i-feed"/></svg>Подкормить
        </button>
        <button class="action" type="button" data-action="lamp" aria-pressed="false">
          <svg class="i" aria-hidden="true"><use href="#i-lamp"/></svg><span data-lamp-label>Лампа</span>
        </button>
      </div>
    </article>

    <article class="plant-card" data-plant-id="2">
      <a class="plant-card__head" href="plant.html?id=2">
        <span class="thumb thumb--lime" aria-hidden="true"><svg><use href="#i-leaf"/></svg></span>
        <span>
          <h2 class="plant-card__name">Лайм персидский</h2>
          <span class="plant-card__place">Гостиная, южное окно</span>
        </span>
        <svg class="i chev" aria-hidden="true"><use href="#i-chev"/></svg>
      </a>

      <div class="stats">
        <div class="stat" data-stat="water" data-status="late">
          <svg class="i stat__icon" aria-hidden="true"><use href="#i-water"/></svg>
          <span class="stat__value"><span data-value>5</span><small>д</small></span>
          <span class="stat__label">с полива</span>
          <span class="stat__flag" data-flag>пора</span>
        </div>
        <div class="stat" data-stat="feed" data-status="ok">
          <svg class="i stat__icon" aria-hidden="true"><use href="#i-feed"/></svg>
          <span class="stat__value"><span data-value>6</span><small>д</small></span>
          <span class="stat__label">с подкормки</span>
          <span class="stat__flag" data-flag></span>
        </div>
        <div class="stat" data-stat="lamp" data-status="soon">
          <svg class="i stat__icon" aria-hidden="true"><use href="#i-lamp"/></svg>
          <span class="stat__value"><span data-value>3</span><small>ч</small></span>
          <span class="stat__label">досветка</span>
          <span class="stat__flag" data-flag>мало</span>
        </div>
      </div>

      <div class="actions">
        <button class="action" type="button" data-action="water" data-primary>
          <svg class="i" aria-hidden="true"><use href="#i-water"/></svg>Полить
        </button>
        <button class="action" type="button" data-action="feed">
          <svg class="i" aria-hidden="true"><use href="#i-feed"/></svg>Подкормить
        </button>
        <button class="action" type="button" data-action="lamp" aria-pressed="true">
          <svg class="i" aria-hidden="true"><use href="#i-lamp"/></svg><span data-lamp-label>Лампа горит</span>
        </button>
      </div>
    </article>

    <button class="add-card" type="button">
      <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
      Добавить растение
    </button>
  </section>
</main>

<nav class="tabbar" aria-label="Разделы">
  <div class="tabbar__inner">
    <a href="index.html" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-plants"/></svg>Растения</a>
    <a href="settings.html"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg>Настройки</a>
  </div>
</nav>

<div class="toast" role="status" aria-live="polite">
  <span class="toast__text"></span>
  <button class="toast__undo" type="button">Отменить</button>
</div>

<script src="app.js"></script>
</body>
</html>
